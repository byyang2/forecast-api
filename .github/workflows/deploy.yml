# Generated by Invoke-DeployGitHubRepo.ps1. Holds no Azure IDs, no secrets, no cluster names.
# Must reference the central workflow @main: the deployment identity trusts exactly that file on that branch.
name: deploy

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  deploy:
    uses: byyang2/gsl-deploy/.github/workflows/deploy-to-aks.yml@main
    with:
      build_context: .
      dockerfile: ./Dockerfile
      manifests: ./manifests
      # runner: gsl-aks-runner   # use a self-hosted runner in the VNet if the cluster or registry is private
