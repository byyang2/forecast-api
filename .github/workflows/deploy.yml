# Calls the central deploy workflow. It holds no Azure IDs and no secrets.
# The reference must be exactly the workflow the managed identity trusts.
name: deploy
on:
  push:
    branches: [ main ]
  workflow_dispatch:
permissions:
  id-token: write
  contents: read
jobs:
  deploy:
    uses: byyang2/gsl-deploy/.github/workflows/deploy-to-aks.yml@main
    with:
      build_context: .
      dockerfile: ./Dockerfile
      manifests: ./manifests

