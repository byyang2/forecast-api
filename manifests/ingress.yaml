apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: __APP__
spec:
  ingressClassName: webapprouting.kubernetes.azure.com
  rules:
    - host: forecast-api.gsl-lab.local
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: __APP__
                port:
                  number: 80
